# OceanVis Application Configuration
spring.application.name=OceanVis
server.port=${PORT:8080}
server.address=0.0.0.0

# H2 In-memory database
spring.datasource.url=jdbc:h2:mem:oceanvisdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.h2.console.enabled=false

# Cache
spring.cache.type=simple

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# Static resources
spring.web.resources.static-locations=classpath:/static/
spring.mvc.throw-exception-if-no-handler-found=false

# Logging
logging.level.com.oceanvis=INFO
logging.level.org.springframework.web=WARN

# OceanVis
oceanvis.mode=${OCEANVIS_MODE:LIVE}
oceanvis.demo-mode=${DEMO_MODE:false}
oceanvis.version=1.0.0
